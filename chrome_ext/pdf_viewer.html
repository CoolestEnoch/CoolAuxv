<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoolAuxv PDF Viewer</title>
  <link rel="stylesheet" href="vendor/pdf_viewer.css">
  <style>
    :root {
      --coolauxv-toolbar-height: 40px;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #f3f4f6;
    }
    #coolauxv-pdf-shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      position: relative;
    }
    #coolauxv-pdf-toolbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      height: var(--coolauxv-toolbar-height);
      padding: 0 12px;
      background: #111827;
      color: #f9fafb;
      font-size: 12px;
      line-height: 1.4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      border-bottom: 1px solid #0f172a;
    }
    #coolauxv-pdf-title {
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.9;
    }
    #coolauxv-pdf-status {
      flex: 0 0 auto;
      color: #fbbf24;
    }
    #viewerContainer {
      position: absolute;
      top: var(--coolauxv-toolbar-height);
      left: 0;
      right: 0;
      bottom: 0;
      overflow: auto;
      background: #e5e7eb;
    }
    #viewer {
      padding: 16px 0;
    }
  </style>
</head>
<body>
  <div id="coolauxv-pdf-shell">
    <div id="coolauxv-pdf-toolbar">
      <div id="coolauxv-pdf-title">PDF</div>
      <div id="coolauxv-pdf-status"></div>
    </div>
    <div id="viewerContainer">
      <div id="viewer" class="pdfViewer"></div>
    </div>
  </div>

  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/pdf_viewer.min.js"></script>
  <script src="pdf_viewer.js"></script>

  <script src="gm_polyfill.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/html2canvas.min.js"></script>
  <script src="vendor/katex.min.js"></script>
  <script src="vendor/auto-render.min.js"></script>
  <script src="coolauxv.user.js"></script>
</body>
</html>
